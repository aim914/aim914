name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: aim914
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#00F521,#00C853,#00E676,#76FF03,#64DD17

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
